<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markdown → HTML Converter</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg-1: #0b0d17;
    --bg-2: #161a2e;
    --accent: #7c5cff;
    --accent-2: #00d4ff;
    --text: #e8ecf3;
    --muted: #8b93a7;
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124, 92, 255, 0.25), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(0, 212, 255, 0.18), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }
  header { text-align: center; margin-bottom: 32px; }
  h1 {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #fff 0%, var(--accent-2) 60%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { color: var(--muted); font-size: 15px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.6);
  }
  .drop {
    border: 2px dashed rgba(255, 255, 255, 0.18);
    border-radius: 14px;
    padding: 36px 24px;
    text-align: center;
    transition: all 0.2s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .drop:hover, .drop.dragging {
    border-color: var(--accent);
    background: rgba(124, 92, 255, 0.07);
    transform: translateY(-1px);
  }
  .drop .icon {
    width: 56px; height: 56px; margin: 0 auto 12px;
    display: grid; place-items: center;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px -10px rgba(124, 92, 255, 0.6);
  }
  .drop .icon svg { width: 28px; height: 28px; color: white; }
  .drop .title { font-weight: 600; margin-bottom: 4px; }
  .drop .hint { color: var(--muted); font-size: 14px; }
  .drop input[type="file"] { display: none; }
  .file-info {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(0, 212, 255, 0.06);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 12px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
  }
  .file-info.show { display: flex; }
  .file-info .name { font-weight: 600; }
  .file-info .meta { color: var(--muted); font-size: 13px; }
  .file-info button {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 10px; border-radius: 8px;
    cursor: pointer; font-size: 12px;
  }
  .file-info button:hover { color: var(--text); border-color: var(--text); }
  .editor-wrap { margin-top: 18px; }
  .editor-label {
    font-size: 13px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 8px; display: flex; justify-content: space-between;
  }
  textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    background: rgba(0, 0, 0, 0.25);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: "JetBrains Mono", "SF Mono", Consolas, Monaco, monospace;
    font-size: 13.5px;
    line-height: 1.6;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--accent); }
  .actions {
    display: flex; gap: 12px; margin-top: 20px;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1; min-width: 140px;
    padding: 14px 20px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.08); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: white;
    box-shadow: 0 15px 40px -15px rgba(124, 92, 255, 0.7);
  }
  .btn.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 20px 50px -15px rgba(124, 92, 255, 0.9);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .opts {
    display: flex; flex-wrap: wrap; gap: 14px;
    margin-top: 14px; font-size: 14px;
  }
  .opts label {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); cursor: pointer;
  }
  .opts input[type="checkbox"] { accent-color: var(--accent); }
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 24, 40, 0.95);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { text-align: center; margin-top: 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Markdown → HTML</h1>
    <div class="sub">Drop a <code>.md</code> file, hit convert, get an optimized standalone HTML in a new tab.</div>
  </header>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".md,.markdown,.txt,text/markdown" />
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="title">Drop your <code>.md</code> file here</div>
      <div class="hint">or click to browse</div>
    </label>

    <div class="file-info" id="fileInfo">
      <div>
        <div class="name" id="fileName">—</div>
        <div class="meta" id="fileMeta">—</div>
      </div>
      <button id="clearFile">Clear</button>
    </div>

    <div class="editor-wrap">
      <div class="editor-label">
        <span>Markdown</span>
        <span id="charCount">0 chars</span>
      </div>
      <textarea id="md" placeholder="# Hello world&#10;&#10;Paste markdown here, or drop a file above."></textarea>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="optToc" /> Include table of contents</label>
      <label><input type="checkbox" id="optDark" checked /> Auto dark mode</label>
      <label><input type="checkbox" id="optHljs" checked /> Syntax highlight code</label>
    </div>

    <div class="actions">
      <button class="btn" id="downloadBtn">Download .html</button>
      <button class="btn primary" id="convertBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>
        </svg>
        Convert &amp; Open
      </button>
    </div>
  </div>

  <footer>Runs entirely in your browser — nothing is uploaded.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const drop = $('drop');
  const fileInput = $('file');
  const md = $('md');
  const fileInfo = $('fileInfo');
  const fileName = $('fileName');
  const fileMeta = $('fileMeta');
  const charCount = $('charCount');
  let currentFileName = 'document';

  marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const updateCount = () => { charCount.textContent = `${md.value.length.toLocaleString()} chars`; };
  md.addEventListener('input', updateCount);

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      md.value = e.target.result;
      currentFileName = file.name.replace(/\.(md|markdown|txt)$/i, '') || 'document';
      fileName.textContent = file.name;
      fileMeta.textContent = `${(file.size / 1024).toFixed(1)} KB · loaded`;
      fileInfo.classList.add('show');
      updateCount();
    };
    reader.readAsText(file);
  }

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(ev => {
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('dragging'); });
  });
  ['dragleave', 'drop'].forEach(ev => {
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('dragging'); });
  });
  drop.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  $('clearFile').addEventListener('click', (e) => {
    e.stopPropagation();
    fileInput.value = '';
    md.value = '';
    fileInfo.classList.remove('show');
    currentFileName = 'document';
    updateCount();
  });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function buildToc(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const heads = tmp.querySelectorAll('h1, h2, h3');
    if (!heads.length) return '';
    let out = '<nav class="toc"><div class="toc-title">Contents</div><ul>';
    heads.forEach(h => {
      const lvl = parseInt(h.tagName[1]);
      const id = h.id || h.textContent.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
      if (!h.id) h.id = id;
      out += `<li class="lvl-${lvl}"><a href="#${id}">${escapeHtml(h.textContent)}</a></li>`;
    });
    out += '</ul></nav>';
    return { toc: out, html: tmp.innerHTML };
  }

  function deriveTitle(mdText) {
    const m = mdText.match(/^\s*#\s+(.+)$/m);
    return m ? m[1].trim() : currentFileName;
  }

  function buildHtml(mdText, opts) {
    let body = marked.parse(mdText);
    let toc = '';
    if (opts.toc) {
      const r = buildToc(body);
      if (r) { toc = r.toc; body = r.html; }
    }
    const title = escapeHtml(deriveTitle(mdText));
    const hljsHead = opts.hljs ? `
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"><\/script>
<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('pre code').forEach(b=>hljs.highlightElement(b));});<\/script>` : '';

    const darkSupport = opts.dark ? `
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #c9d1d9; --muted: #8b949e;
    --border: #30363d; --link: #58a6ff; --code-bg: #161b22;
    --quote-border: #30363d; --quote-bg: #161b22;
    --table-alt: #161b22; --kbd-bg: #161b22;
  }
}` : '';

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
${hljsHead}
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #656d76;
  --border: #d0d7de; --link: #0969da; --code-bg: #f6f8fa;
  --quote-border: #d0d7de; --quote-bg: #f6f8fa;
  --table-alt: #f6f8fa; --kbd-bg: #f6f8fa;
}
${darkSupport}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  padding: 48px 24px 96px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
.container {
  max-width: 820px;
  margin: 0 auto;
}
.toc {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 32px;
  font-size: 14.5px;
}
.toc-title {
  font-weight: 600; text-transform: uppercase;
  font-size: 12px; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 8px;
}
.toc ul { list-style: none; padding: 0; margin: 0; }
.toc li { margin: 4px 0; }
.toc li.lvl-2 { padding-left: 16px; }
.toc li.lvl-3 { padding-left: 32px; }
.toc a { color: var(--link); text-decoration: none; }
.toc a:hover { text-decoration: underline; }
h1, h2, h3, h4, h5, h6 {
  margin-top: 1.8em;
  margin-bottom: 0.6em;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
}
h1 { font-size: 2.1em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
h2 { font-size: 1.55em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.25em; }
h4 { font-size: 1em; }
h5 { font-size: 0.9em; }
h6 { font-size: 0.85em; color: var(--muted); }
p { margin: 0 0 1em; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { padding-left: 2em; margin: 0 0 1em; }
li { margin: 0.25em 0; }
li > p { margin: 0.5em 0; }
blockquote {
  margin: 0 0 1em;
  padding: 0.6em 1em;
  border-left: 4px solid var(--quote-border);
  background: var(--quote-bg);
  color: var(--muted);
  border-radius: 0 8px 8px 0;
}
blockquote > :last-child { margin-bottom: 0; }
code {
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.88em;
  padding: 0.18em 0.4em;
  background: var(--code-bg);
  border-radius: 5px;
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  line-height: 1.5;
  margin: 0 0 1em;
}
pre code {
  padding: 0; background: transparent; font-size: 0.88em;
}
table {
  border-collapse: collapse;
  margin: 0 0 1em;
  width: 100%;
  display: block;
  overflow-x: auto;
}
th, td {
  border: 1px solid var(--border);
  padding: 8px 14px;
  text-align: left;
}
th { background: var(--code-bg); font-weight: 600; }
tr:nth-child(even) td { background: var(--table-alt); }
img { max-width: 100%; height: auto; border-radius: 6px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
kbd {
  background: var(--kbd-bg);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 2px 6px;
  font-size: 0.85em;
  font-family: ui-monospace, monospace;
}
.task-list-item { list-style: none; margin-left: -1.5em; }
.task-list-item input { margin-right: 0.5em; }
@media print {
  body { padding: 24px; font-size: 12pt; }
  .toc { page-break-after: always; }
  pre, blockquote { page-break-inside: avoid; }
  a { color: var(--fg); text-decoration: underline; }
}
</style>
</head>
<body>
<main class="container">
${toc}
${body}
</main>
</body>
</html>`;
  }

  function gatherOpts() {
    return {
      toc: $('optToc').checked,
      dark: $('optDark').checked,
      hljs: $('optHljs').checked,
    };
  }

  $('convertBtn').addEventListener('click', () => {
    if (!md.value.trim()) { toast('Add some markdown first'); return; }
    const html = buildHtml(md.value, gatherOpts());
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if (!w) { toast('Pop-up blocked — allow pop-ups for this page'); }
    else { toast('Opened in new tab'); }
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
  });

  $('downloadBtn').addEventListener('click', () => {
    if (!md.value.trim()) { toast('Add some markdown first'); return; }
    const html = buildHtml(md.value, gatherOpts());
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentFileName}.html`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5_000);
    toast('Downloaded');
  });

  updateCount();
</script>
</body>
</html>
